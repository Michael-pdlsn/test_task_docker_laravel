services:
  app_php:
    # Own tag for the locally built image, so it does not shadow the official php:8.3-fpm tag.
    image: whois-app-php
    container_name: ${PHP_CONTAINER_NAME:-php_app}
    build:
      context: ./php
      dockerfile: Dockerfile
    volumes:
      - ${PROJECT_SOURCE}:/var/www/html
    networks:
      backend:
        aliases:
          - app_php

  nginx:
    image: nginx:1.27
    container_name: ${NGINX_CONTAINER_NAME:-nginx}
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ${PROJECT_SOURCE}:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/nginx/cache:/var/cache/nginx
      - ./data/nginx/logs:/var/log/nginx
      - ./data/nginx/run:/var/run
    environment:
      - NGINX_USER=www-data
    user: "${UID}:${GID}"
    depends_on:
      - app_php
    networks:
      - backend

networks:
  backend:
    driver: bridge
